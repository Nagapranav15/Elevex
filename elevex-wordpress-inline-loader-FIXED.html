<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ELEVEX — Lifting Possibilities Higher</title>
<meta name="description" content="ELEVEX premium loading experience — a scissor-lift preloader component.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
/* ═══════════════════════════════════════════════════════════
   ELEVEX PRELOADER — design tokens
   ═══════════════════════════════════════════════════════════ */
:root {
  --elevex-blue: #0066FF;
  --elevex-blue-dim: #0052CC;
  --elevex-yellow: #F5B800;
  --charcoal: #1A1A1F;
  --charcoal-soft: #4A4D54;
  --grey-line: #E4E6EA;
  --grey-faint: #F0F1F3;
  --white: #FFFFFF;
  --ease-mech: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow-x: hidden;
}

html.loading-lock, html.loading-lock body {
  overflow: hidden;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--white);
  color: var(--charcoal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════════════
   LOADER SHELL
   ═══════════════════════════════════════════════════════════ */
#elevex-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  overflow: hidden;
  transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
}

#elevex-loader.is-hidden {
  opacity: 0;
  transform: scale(1.015);
  pointer-events: none;
}

#elevex-loader.is-removed { display: none; }

/* subtle technical grid backdrop */
.loader-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--grey-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--grey-faint) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.6;
  mask-image: radial-gradient(circle at center, #000 0%, transparent 72%);
  -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 72%);
}

/* minimal engineering coordinate ticks, left/right edges */
.loader-ticks {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 64px;
  opacity: 0.35;
}
.loader-ticks--left { left: clamp(16px, 4vw, 56px); }
.loader-ticks--right { right: clamp(16px, 4vw, 56px); }
.loader-ticks span {
  width: 22px;
  height: 1px;
  background: var(--charcoal-soft);
  position: relative;
}
.loader-ticks--left span::after,
.loader-ticks--right span::after {
  content: '';
  position: absolute;
  top: -3px;
  width: 1px;
  height: 7px;
  background: var(--elevex-blue);
}
.loader-ticks--left span::after { left: 0; }
.loader-ticks--right span::after { right: 0; background: var(--elevex-yellow); }

/* ═══════════════════════════════════════════════════════════
   CONTENT LAYOUT
   ═══════════════════════════════════════════════════════════ */
.loader-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 1400px;
  padding: 0 24px;
}

.loader-brand {
  text-align: center;
  width: 100%;
  max-width: 560px;
  margin-bottom: clamp(8px, 2vw, 16px);
}

.loader-wordmark {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: clamp(2.6rem, 8vw, 4.4rem);
  letter-spacing: -0.02em;
  line-height: 1;
  display: flex;
  justify-content: center;
  gap: 0.02em;
}
.wm-blue { color: var(--elevex-blue); }
.wm-yellow { color: var(--elevex-yellow); }

/* animated yellow accent line, grows 0% -> 100% with load progress */
.brand-accent {
  width: 88px;
  max-width: 40%;
  height: 2px;
  margin: 14px auto 0;
  background: var(--grey-line);
  overflow: hidden;
}
.brand-accent-fill {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--elevex-yellow);
  transform: scaleX(0);
  transform-origin: left center;
}

.loader-tagline {
  margin-top: 12px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: clamp(0.68rem, 1.6vw, 0.8rem);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--charcoal);
}

.loader-subline {
  margin-top: 8px;
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--charcoal-soft);
}

/* ═══════════════════════════════════════════════════════════
   MACHINE STAGE
   ═══════════════════════════════════════════════════════════ */
.loader-stage {
  position: relative;
  width: min(92vw, 1100px);
  margin: clamp(6px, 2vw, 10px) 0;
}

.loader-svg { width: 100%; height: auto; display: block; overflow: visible; }

.ground-line { stroke: var(--grey-line); stroke-width: 2; }

#machineShadow { transition: none; }

.hyd-barrel { stroke: var(--charcoal); stroke-width: 7; stroke-linecap: round; }
.hyd-rod { stroke: url(#metalGradient); stroke-width: 3.5; stroke-linecap: round; }
.hyd-piston-head { fill: var(--charcoal); }
.hyd-bolt { fill: var(--elevex-yellow); }

.scissor-rod { stroke: url(#metalGradient); stroke-width: 9; stroke-linecap: round; }
.scissor-rod.accent { stroke: var(--charcoal); stroke-width: 9; stroke-linecap: round; opacity: 0.92; }
.scissor-pivot { fill: var(--charcoal); }
.scissor-pivot-ring { fill: none; stroke: var(--elevex-yellow); stroke-width: 1.4; opacity: 0.9; }

/* wheel detail: spokes + bolt make the JS-driven rotation actually visible */
.wheel-spoke { stroke: #5a5f68; stroke-width: 2; stroke-linecap: round; }
.wheel-bolt { fill: var(--elevex-yellow); }

/* tiny mechanical startup jitter, played once before travel begins.
   Lives on a nested group so it never fights the JS-driven position
   transform on #machineGroup. */
#machineJitter { transform-box: fill-box; transform-origin: center; }
.is-starting #machineJitter { animation: startupJitter 0.42s ease-in-out; }
@keyframes startupJitter {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-1.1px, 0.6px); }
  40% { transform: translate(1px, -0.5px); }
  60% { transform: translate(-0.8px, 0.5px); }
  80% { transform: translate(0.5px, -0.3px); }
}

/* ═══════════════════════════════════════════════════════════
   ELEVATION GAUGE — minimal engineering height readout
   ═══════════════════════════════════════════════════════════ */
.elevation-gauge {
  position: absolute;
  left: 1%;
  bottom: 14%;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  z-index: 1;
  pointer-events: none;
}
.elevation-track {
  position: relative;
  width: 2px;
  height: 92px;
  background: var(--grey-line);
  border-radius: 2px;
}
.elevation-marker {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--elevex-blue);
  transform: translate(-50%, 50%);
  box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.14);
}
.elevation-labels {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 92px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--charcoal-soft);
  opacity: 0.55;
}
.elevation-labels span { transition: color 0.2s var(--ease-out), opacity 0.2s var(--ease-out); }
.elevation-labels span.is-active { color: var(--elevex-blue); opacity: 1; }

/* ═══════════════════════════════════════════════════════════
   PROGRESS
   ═══════════════════════════════════════════════════════════ */
.loader-progress {
  width: 100%;
  max-width: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: clamp(4px, 1.5vw, 10px);
}

.loader-percent {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-size: clamp(1.3rem, 3vw, 1.6rem);
  color: var(--charcoal);
  letter-spacing: 0.01em;
  margin-bottom: 10px;
}
.percent-sign { font-size: 0.6em; margin-left: 2px; color: var(--charcoal-soft); }

.loader-bar-track {
  width: 100%;
  height: 2px;
  background: var(--grey-line);
  border-radius: 2px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--elevex-blue), var(--elevex-yellow));
}

.loader-label {
  margin-top: 12px;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--charcoal-soft);
}

/* ═══════════════════════════════════════════════════════════
   DEMO SITE CONTENT (test scaffold only — remove on integration)
   ═══════════════════════════════════════════════════════════ */
#site-content {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.demo-hero { max-width: 520px; text-align: center; }
.demo-kicker {
  display: inline-block;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--elevex-blue);
  margin-bottom: 14px;
}
.demo-hero h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  margin-bottom: 12px;
}
.demo-hero p { color: var(--charcoal-soft); line-height: 1.6; margin-bottom: 24px; }
.demo-hero code {
  background: var(--grey-faint);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
}
#replayBtn {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  padding: 12px 28px;
  border-radius: 8px;
  border: none;
  background: var(--charcoal);
  color: var(--white);
  cursor: pointer;
  transition: background 0.25s var(--ease-out), transform 0.25s var(--ease-out);
}
#replayBtn:hover { background: var(--elevex-blue); transform: translateY(-1px); }

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 560px) {
  .loader-ticks { display: none; }
  .loader-content { max-width: 92vw; }
  .loader-stage { width: min(94vw, 360px); }
  .elevation-gauge { left: -2%; bottom: 10%; }
  .elevation-track, .elevation-labels { height: 68px; }
}

@media (max-height: 700px) {
  .loader-stage { width: min(72vw, 640px); }
}

@media (max-height: 620px) {
  .loader-brand { margin-bottom: 4px; }
  .loader-wordmark { font-size: clamp(2rem, 7vw, 2.8rem); }
  .loader-tagline { margin-top: 6px; }
  .loader-subline { display: none; }
  .loader-stage { width: min(56vw, 460px); margin: 4px 0; }
  .elevation-gauge { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  #machineJitter { animation: none !important; }
  #elevex-loader { transition: opacity 0.4s linear; }
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     ELEVEX PRELOADER — self-contained, reusable component.
     Drop this markup block + style.css + script.js into any page.
     Remove #site-content below; it exists only to demo the reveal.
     ═══════════════════════════════════════════════════════════ -->
<div id="elevex-loader" aria-live="polite" aria-label="Loading ELEVEX">

  <div class="loader-grid" aria-hidden="true"></div>

  <div class="loader-ticks loader-ticks--left" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <div class="loader-ticks loader-ticks--right" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <div class="loader-content">

    <div class="loader-brand">
      <h1 class="loader-wordmark">
        <span class="wm-blue">ELEV</span><span class="wm-yellow">EX</span>
      </h1>
      <div class="brand-accent" aria-hidden="true"><span class="brand-accent-fill" id="brandAccentFill"></span></div>
      <p class="loader-tagline">Lifting Possibilities Higher</p>
      <p class="loader-subline">Mobile Elevation Systems</p>
    </div>

    <div class="loader-stage">

      <div class="elevation-gauge" aria-hidden="true">
        <div class="elevation-track">
          <span class="elevation-marker" id="elevationMarker"></span>
        </div>
        <div class="elevation-labels">
          <span data-m="6">6M</span>
          <span data-m="4">4M</span>
          <span data-m="2">2M</span>
          <span data-m="0">0M</span>
        </div>
      </div>

      <svg class="loader-svg" id="scissorLift" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="#cfd3d8"/>
            <stop offset="45%" stop-color="#f5f6f8"/>
            <stop offset="55%" stop-color="#f5f6f8"/>
            <stop offset="100%" stop-color="#a9adb3"/>
          </linearGradient>
          <linearGradient id="platformGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#0066FF"/>
            <stop offset="100%" stop-color="#0052CC"/>
          </linearGradient>
          <radialGradient id="wheelGradient" cx="35%" cy="35%" r="70%">
            <stop offset="0%"   stop-color="#4a4f57"/>
            <stop offset="100%" stop-color="#1c1e22"/>
          </radialGradient>
        </defs>

        <!-- ground line -->
        <line class="ground-line" x1="40" y1="362" x2="960" y2="362"/>

        <!-- ground shadow (updated by JS, moves + softens with the machine) -->
        <ellipse id="machineShadow" cx="220" cy="364" rx="108" ry="9" fill="#0A0A0F" opacity="0.14"/>

        <!-- MACHINE GROUP — horizontal travel + suspension applied here.
             Everything below keeps its original local geometry; only this
             wrapper's transform moves, so the logo/percent stay put while
             the machine physically travels across the stage. -->
        <g id="machineGroup">
          <g id="machineJitter">

            <!-- base chassis (static geometry; wheels rotate individually) -->
            <g id="baseChassis">
              <rect x="118" y="322" width="204" height="34" rx="6" fill="#1c1e22"/>
              <rect x="118" y="322" width="204" height="8"  rx="4" fill="#F5B800"/>
              <rect x="150" y="316" width="140" height="10" rx="3" fill="#2a2d33"/>
              <g class="wheel-group wheel-group--left" id="wheelLeft">
                <circle cx="150" cy="358" r="21" fill="url(#wheelGradient)"/>
                <line class="wheel-spoke" x1="150" y1="358" x2="150" y2="340"/>
                <line class="wheel-spoke" x1="150" y1="358" x2="165.6" y2="367"/>
                <line class="wheel-spoke" x1="150" y1="358" x2="134.4" y2="367"/>
                <circle cx="150" cy="358" r="8" fill="#3a3d43" stroke="#0A0A0F" stroke-width="1.5"/>
                <circle class="wheel-bolt" cx="150" cy="344.5" r="2"/>
              </g>
              <g class="wheel-group wheel-group--right" id="wheelRight">
                <circle cx="290" cy="358" r="21" fill="url(#wheelGradient)"/>
                <line class="wheel-spoke" x1="290" y1="358" x2="290" y2="340"/>
                <line class="wheel-spoke" x1="290" y1="358" x2="305.6" y2="367"/>
                <line class="wheel-spoke" x1="290" y1="358" x2="274.4" y2="367"/>
                <circle cx="290" cy="358" r="8" fill="#3a3d43" stroke="#0A0A0F" stroke-width="1.5"/>
                <circle class="wheel-bolt" cx="290" cy="344.5" r="2"/>
              </g>
            </g>

            <!-- hydraulic cylinder (updated by JS) -->
            <g id="hydraulicGroup">
              <line id="hydBarrel" class="hyd-barrel" x1="220" y1="320" x2="220" y2="280"/>
              <line id="hydRod"    class="hyd-rod"    x1="220" y1="280" x2="220" y2="258"/>
              <circle id="hydPistonHead" class="hyd-piston-head" cx="220" cy="258" r="4.5"/>
              <circle class="hyd-bolt" cx="220" cy="320" r="2.5"/>
            </g>

            <!-- scissor arms (populated by JS) -->
            <g id="scissorArms"></g>

            <!-- platform (positioned by JS) -->
            <g id="platform">
              <rect x="152" y="-12" width="136" height="12" rx="2" fill="url(#platformGradient)"/>
              <rect x="146" y="-4"  width="148" height="6"  rx="2" fill="#1c1e22"/>
              <g class="rail" stroke="#1c1e22" stroke-width="3.5" stroke-linecap="round" fill="none">
                <line x1="158" y1="-12" x2="158" y2="-48"/>
                <line x1="220" y1="-12" x2="220" y2="-48"/>
                <line x1="282" y1="-12" x2="282" y2="-48"/>
                <line x1="158" y1="-48" x2="282" y2="-48"/>
                <line x1="158" y1="-30" x2="282" y2="-30"/>
              </g>
              <rect x="168" y="-24" width="18" height="14" rx="2" fill="#F5B800"/>
            </g>

          </g>
        </g>
      </svg>
    </div>

    <div class="loader-progress">
      <div class="loader-percent"><span id="percentValue">00</span><span class="percent-sign">%</span></div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill" id="loaderBarFill"></div>
      </div>
      <div class="loader-label">Loading Experience</div>
    </div>

  </div>
</div>


<script>
/* ═══════════════════════════════════════════════════════════════
   ELEVEX PRELOADER ENGINE
   Real scissor-lift geometry: a stack of identical rhombus
   ("lazy-tongs") units, each formed by two rods of fixed length
   crossing at their shared pivot. All units share one angle theta
   (measured from vertical), so the whole stack's pin columns stay
   perfectly vertical while width/height trade off as theta changes.

   On top of that mechanical core, a single `progress` value (0-100)
   also drives a horizontal journey: the whole machine — chassis,
   hydraulics, scissor stack and platform — travels left -> center ->
   right inside #machineGroup, while the ELEVEX wordmark and the
   percentage readout stay put. The camera is fixed; the machine moves.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var DEG = Math.PI / 180;

  // Geometry constants (SVG viewBox is 0 0 1000 400)
  var VB_W = 1000;
  var CX_REF = 220;         // local horizontal reference every static part is drawn around
  var Y0 = 328;              // base pivot level
  var UNITS = 3;             // number of stacked scissor units
  var ROD_LEN = 95;          // rod length per unit
  var THETA_COMPRESSED = 73 * DEG;
  var THETA_EXTENDED = 25 * DEG;   // ~75% of theoretical max extension
  var THETA_OVERSHOOT = 3 * DEG;   // hydraulic settle amount

  var HYD_ANCHOR_Y = Y0 - 8;
  var HYD_BARREL_LEN = 40;

  var WHEEL_R = 21;          // wheel radius, used so rotation matches distance rolled

  // Horizontal travel range, as a fraction of the viewBox width. The
  // machine's own local bounding box is ~[-102, +102] around CX_REF, so
  // both endpoints keep a safe margin inside [0, VB_W] on every breakpoint.
  var TRAVEL_DESKTOP = { left: 0.17, right: 0.79 };
  var TRAVEL_MOBILE = { left: 0.13, right: 0.66 };

  var MIN_DURATION = 3400;  // ms, full mechanical rise + travel duration
  var STARTUP_DURATION = 380; // ms, mechanical wake-up jitter before travel begins
  var FINISH_DURATION = 480;
  var SETTLE_UP = 180;
  var SETTLE_DOWN = 280;
  var HOLD_DURATION = 350;
  var FADE_DURATION = 700;  // keep in sync with CSS .is-hidden transition

  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- easing ---------- */
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function easeOutQuad(x) { return 1 - (1 - x) * (1 - x); }

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  /* Perlin's smootherstep: zero first AND second derivative at both
     ends, continuous everywhere in between — no seams, no velocity
     jumps, so nothing ever visibly "catches" mid-motion. This is the
     ONE easing curve for the whole journey: the master tween below
     runs it once to produce `progress`, and every visual — the percent
     readout, the bar fill, the machine's horizontal position, and the
     scissor extension — reads that exact same number. Because they're
     all a direct, unwarped function of one shared value, they can
     never drift out of ratio or speed with each other.  */
  function smootherstep(t) {
    t = clamp01(t);
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (var k in attrs) el.setAttribute(k, attrs[k]);
    }
    return el;
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* tween(duration, easeFn, onFrame) -> Promise, driven by rAF */
  function tween(duration, easeFn, onFrame) {
    return new Promise(function (resolve) {
      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / duration);
        onFrame(easeFn(t), t);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  function ElevexLoader(root) {
    this.root = root;
    this.percentEl = root.querySelector('#percentValue');
    this.barFillEl = root.querySelector('#loaderBarFill');
    this.accentFillEl = root.querySelector('#brandAccentFill');
    this.platformEl = root.querySelector('#platform');
    this.armsGroup = root.querySelector('#scissorArms');
    this.hydBarrel = root.querySelector('#hydBarrel');
    this.hydRod = root.querySelector('#hydRod');
    this.hydPistonHead = root.querySelector('#hydPistonHead');
    this.machineGroup = root.querySelector('#machineGroup');
    this.shadowEl = root.querySelector('#machineShadow');
    this.wheelLeft = root.querySelector('#wheelLeft');
    this.wheelRight = root.querySelector('#wheelRight');
    this.elevationMarkerEl = root.querySelector('#elevationMarker');
    this.elevationLabels = Array.prototype.slice.call(root.querySelectorAll('.elevation-labels span'));
    this.elevationTrackH = 92;

    this.units = [];
    this.baseBoltLeft = null;
    this.baseBoltRight = null;

    this.pageLoaded = false;
    this.autoComplete = false;
    this.finished = false;
    this.currentProgress = 0;
    this.travel = this._computeTravel();

    this._buildArms();
    this._setTheta(THETA_COMPRESSED);
    this.setProgress(0);

    document.documentElement.classList.add('loading-lock');
    root.classList.add('is-loading');

    var self = this;
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        self.travel = self._computeTravel();
        self.setProgress(self.currentProgress);
      }, 150);
    });
  }

  ElevexLoader.prototype._computeTravel = function () {
    if (this.elevationMarkerEl) {
      this.elevationTrackH = this.elevationMarkerEl.parentElement.clientHeight || this.elevationTrackH;
    }
    return window.innerWidth <= 560 ? TRAVEL_MOBILE : TRAVEL_DESKTOP;
  };

  ElevexLoader.prototype._buildArms = function () {
    for (var i = 0; i < UNITS; i++) {
      var rodA = svgEl('line', { class: 'scissor-rod' });
      var rodB = svgEl('line', { class: 'scissor-rod accent' });
      var pivot = svgEl('circle', { class: 'scissor-pivot', r: 5 });
      var ring = svgEl('circle', { class: 'scissor-pivot-ring', r: 8 });
      this.armsGroup.appendChild(rodA);
      this.armsGroup.appendChild(rodB);
      this.armsGroup.appendChild(ring);
      this.armsGroup.appendChild(pivot);
      this.units.push({ rodA: rodA, rodB: rodB, pivot: pivot, ring: ring });
    }
    this.baseBoltLeft = svgEl('circle', { class: 'scissor-pivot', r: 4 });
    this.baseBoltRight = svgEl('circle', { class: 'scissor-pivot', r: 4 });
    this.armsGroup.appendChild(this.baseBoltLeft);
    this.armsGroup.appendChild(this.baseBoltRight);
  };

  /* the single source of mechanical truth: given theta, place every
     part of the scissor stack, platform and hydraulic piston. All
     coordinates stay in the machine's own local frame (centered on
     CX_REF) — #machineGroup's transform is what actually relocates
     the whole assembly across the stage. */
  ElevexLoader.prototype._setTheta = function (theta) {
    var halfW = (ROD_LEN * Math.sin(theta)) / 2;
    var xLeft = CX_REF - halfW;
    var xRight = CX_REF + halfW;

    var levels = [];
    for (var i = 0; i <= UNITS; i++) {
      levels.push(Y0 - i * ROD_LEN * Math.cos(theta));
    }

    for (i = 0; i < UNITS; i++) {
      var yBottom = levels[i];
      var yTop = levels[i + 1];
      var u = this.units[i];
      u.rodA.setAttribute('x1', xLeft); u.rodA.setAttribute('y1', yBottom);
      u.rodA.setAttribute('x2', xRight); u.rodA.setAttribute('y2', yTop);
      u.rodB.setAttribute('x1', xRight); u.rodB.setAttribute('y1', yBottom);
      u.rodB.setAttribute('x2', xLeft); u.rodB.setAttribute('y2', yTop);
      var pcy = (yBottom + yTop) / 2;
      u.pivot.setAttribute('cx', CX_REF); u.pivot.setAttribute('cy', pcy);
      u.ring.setAttribute('cx', CX_REF); u.ring.setAttribute('cy', pcy);
    }

    this.baseBoltLeft.setAttribute('cx', xLeft); this.baseBoltLeft.setAttribute('cy', levels[0]);
    this.baseBoltRight.setAttribute('cx', xRight); this.baseBoltRight.setAttribute('cy', levels[0]);

    this.platformEl.setAttribute('transform', 'translate(0,' + levels[UNITS].toFixed(2) + ')');

    var barrelEndY = HYD_ANCHOR_Y - HYD_BARREL_LEN;
    var topPivotY = (levels[UNITS - 1] + levels[UNITS]) / 2;
    this.hydBarrel.setAttribute('y1', HYD_ANCHOR_Y);
    this.hydBarrel.setAttribute('y2', barrelEndY);
    this.hydRod.setAttribute('y1', barrelEndY);
    this.hydRod.setAttribute('y2', topPivotY);
    this.hydPistonHead.setAttribute('cy', topPivotY);

    this._liftHeight = Y0 - levels[UNITS]; // used for shadow softening
  };

  ElevexLoader.prototype._thetaForLiftFrac = function (liftFrac) {
    return THETA_COMPRESSED + (THETA_EXTENDED - THETA_COMPRESSED) * liftFrac;
  };

  /* positions #machineGroup horizontally for this frame, adds a tiny
     cinematic trajectory arc + suspension bounce (both position-driven,
     not time-driven, so they start/stop exactly with real motion), and
     rolls the wheels an amount proportional to distance actually moved —
     never a free-spinning animation. */
  ElevexLoader.prototype._setMachineX = function (p01) {
    var worldX = VB_W * (this.travel.left + (this.travel.right - this.travel.left) * p01);
    var dx = worldX - CX_REF;

    var dy = 0;
    if (!REDUCED_MOTION) {
      var envelope = Math.max(0, Math.sin(clamp01(p01) * Math.PI)) * 1.1;
      var bounce = Math.sin(p01 * 3.5 * Math.PI * 2) * 0.6 * envelope;
      var arc = Math.sin(p01 * Math.PI) * -1.4;
      dy = bounce + arc;
    }

    this.machineGroup.setAttribute('transform', 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')');

    var wheelAngleDeg = ((worldX / WHEEL_R) * (180 / Math.PI)) % 360;
    this.wheelLeft.setAttribute('transform', 'rotate(' + wheelAngleDeg.toFixed(1) + ' 150 358)');
    this.wheelRight.setAttribute('transform', 'rotate(' + wheelAngleDeg.toFixed(1) + ' 290 358)');

    this.shadowEl.setAttribute('cx', (CX_REF + dx).toFixed(2));
    var liftFrac01 = Math.max(0, Math.min(1, (this._liftHeight || 0) / (ROD_LEN * UNITS)));
    this.shadowEl.setAttribute('opacity', (0.16 - liftFrac01 * 0.07).toFixed(3));
    this.shadowEl.setAttribute('rx', (108 - liftFrac01 * 12).toFixed(1));
  };

  ElevexLoader.prototype._updateElevation = function (liftFrac) {
    this.elevationMarkerEl.style.transform = 'translate(-50%, 50%) translateY(' + (-(liftFrac * this.elevationTrackH)).toFixed(1) + 'px)';
    var meters = liftFrac * 6;
    var nearest = Math.round(meters / 2) * 2;
    this.elevationLabels.forEach(function (label) {
      label.classList.toggle('is-active', parseInt(label.getAttribute('data-m'), 10) === nearest);
    });
  };

  ElevexLoader.prototype.setProgress = function (pct) {
    pct = Math.max(0, Math.min(100, pct));
    this.currentProgress = pct;
    var display = Math.round(pct);
    this.percentEl.textContent = (display < 10 ? '0' : '') + display;
    this.barFillEl.style.width = pct + '%';
    if (this.accentFillEl) this.accentFillEl.style.transform = 'scaleX(' + (pct / 100).toFixed(3) + ')';

    // xFrac and liftFrac are `p01` itself, not a re-warped copy of it —
    // that's what keeps the machine's travel/lift and the percent
    // readout moving in exact lockstep, at the same ratio and speed,
    // for every frame of the animation.
    var p01 = pct / 100;

    this._setTheta(this._thetaForLiftFrac(p01));
    this._setMachineX(p01);
    this._updateElevation(p01);
  };

  ElevexLoader.prototype._maybeFinish = function () {
    if (this.pageLoaded && this.autoComplete && !this.finished) {
      this.finished = true;
      this._finish();
    }
  };

  /* One unbroken smootherstep curve carries progress from 0 all the way
     to 100 over MIN_DURATION. When the real page is already loaded by
     then (the overwhelmingly common case), that single curve is the
     entire journey — there is no second tween to hand off to, so there
     is no seam for velocity to dip to zero at, e.g. at a fixed 90%
     checkpoint. Only if real assets are genuinely still loading does
     this hold near the top (96%) instead of overshooting to a false
     100 — exactly the same "don't lie about being done" behavior as
     before, just without splitting the common path into two tweens. */
  var LOAD_WAIT_CAP = 96;

  ElevexLoader.prototype._runAuto = function () {
    var self = this;
    tween(MIN_DURATION, smootherstep, function (eased) {
      var target = eased * 100;
      if (!self.pageLoaded && target > LOAD_WAIT_CAP) target = LOAD_WAIT_CAP;
      self.setProgress(target);
    }).then(function () {
      self.autoComplete = true;
      if (self.pageLoaded) {
        self._maybeFinish();
      } else {
        self._trickle();
      }
    });
  };

  /* if real assets are still loading past the min duration, creep
     the bar forward slowly instead of appearing stuck */
  ElevexLoader.prototype._trickle = function () {
    var self = this;
    function step() {
      if (self.pageLoaded || self.finished) { self._maybeFinish(); return; }
      self.setProgress(self.currentProgress + (97 - self.currentProgress) * 0.02);
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  };

  ElevexLoader.prototype._finish = function () {
    var self = this;
    var startProgress = this.currentProgress;
    // The main tween already glided smoothly to 100 in the common case —
    // skip a redundant (and seam-prone) second progress tween and go
    // straight into the mechanical settle.
    var reachEnd = startProgress >= 99.5
      ? Promise.resolve()
      : tween(FINISH_DURATION, smootherstep, function (eased) {
          self.setProgress(startProgress + (100 - startProgress) * eased);
        });
    reachEnd
      .then(function () {
        self.setProgress(100);
        var extended = self._thetaForLiftFrac(1);
        var over = extended - THETA_OVERSHOOT;
        return tween(SETTLE_UP, easeOutQuad, function (eased) {
          self._setTheta(extended + (over - extended) * eased);
        });
      })
      .then(function () {
        var extended = self._thetaForLiftFrac(1);
        var over = extended - THETA_OVERSHOOT;
        return tween(SETTLE_DOWN, easeInOutCubic, function (eased) {
          self._setTheta(over + (extended - over) * eased);
        });
      })
      .then(function () { return sleep(HOLD_DURATION); })
      .then(function () {
        document.documentElement.classList.remove('loading-lock');
        self.root.classList.remove('is-loading');
        self.root.classList.add('is-hidden');
        return sleep(FADE_DURATION);
      })
      .then(function () {
        self.root.classList.add('is-removed');
        self.root.setAttribute('aria-hidden', 'true');
        document.dispatchEvent(new CustomEvent('elevex:loaded'));
      });
  };

  ElevexLoader.prototype.start = function () {
    var self = this;

    // Mechanical startup jitter plays concurrently with the very start
    // of the rise — never as a blocking delay before it — so progress
    // is always advancing and nothing reads as "stuck" at 0%. smootherstep
    // already keeps real motion close to zero for the first few frames
    // (zero velocity right at t=0 by construction), so the jitter still
    // reads as a startup beat rather than fighting the travel.
    if (!REDUCED_MOTION) {
      this.root.classList.add('is-starting');
      setTimeout(function () { self.root.classList.remove('is-starting'); }, STARTUP_DURATION);
    }

    if (document.readyState === 'complete') {
      this.pageLoaded = true;
    } else {
      window.addEventListener('load', function () {
        self.pageLoaded = true;
        self._maybeFinish();
      });
    }

    this._runAuto();
  };

  /* public API */
  ElevexLoader.prototype.finish = function () {
    this.pageLoaded = true;
    this.autoComplete = true;
    this._maybeFinish();
  };

  ElevexLoader.prototype.restart = function () {
    this.finished = false;
    this.autoComplete = false;
    this.pageLoaded = true; // page is already loaded on a manual replay
    this.root.classList.remove('is-hidden', 'is-removed');
    this.root.removeAttribute('aria-hidden');
    document.documentElement.classList.add('loading-lock');
    this.root.classList.add('is-loading');
    this.setProgress(0);
    this.start();
  };

  /* ---------- bootstrap ---------- */
  function initElevexLoader() {
    var root = document.getElementById('elevex-loader');
    if (!root || window.ElevexLoader) return;

    var instance = new ElevexLoader(root);
    window.ElevexLoader = instance;
    window.finishLoading = function () { instance.finish(); };

    // Start immediately. This makes the loader reliable when opened
    // directly as a local HTML file and when embedded in WordPress.
    instance.start();

    var replayBtn = document.getElementById('replayBtn');
    if (replayBtn) {
      replayBtn.addEventListener('click', function () { instance.restart(); });
    }
  }

  // The script is placed after the loader markup, so initialize immediately.
  // The DOMContentLoaded fallback also covers unusual WordPress injection timing.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initElevexLoader, { once: true });
  } else {
    initElevexLoader();
  }
})();

</script>

</body>
</html>
